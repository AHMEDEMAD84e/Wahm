<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F0E2D4">
<title>Cart — Wahm</title>
<meta name="description" content="Wahm — luxury perfumes for women and men.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="Wahm Luxury Perfume Emblem.png">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
<header>
  <div class="nav container">
    <a href="Index.html" class="logo">Wahm</a>
    <div>
      <a href="cart.html" aria-label="Cart"><i class="ri-shopping-bag-line" id="cart-icon"><span id="cart-count">0</span></i></a>
    </div>
  </div>
</header>
<main class="container">
  <h1 class="cart-title">Shopping cart</h1>
  <div class="cart-box">
    <div id="cartItems"></div>
    <aside class="cart-summary">
      <div id="cartTotal"></div>
      <button class="checkout-btn whatsapp-btn" id="checkout-btn"><i class="ri-whatsapp-line"></i> Order on WhatsApp</button>
      <button class="checkout-btn insta-btn" id="checkout-insta-btn"><i class="ri-instagram-line"></i> Order on Instagram</button>
    </aside>
  </div>
</main>
<footer class="footer">
  <div class="container">
    <h2 class="footer-brand">Wahm</h2>
    <div class="footer-social">
      <a href="https://www.instagram.com/_wahmm._?stkn=Nzl4cmlxa3Nwa3c5&utm_source=qr" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="ri-instagram-line"></i></a>
    </div>
    <p class="footer-slogan">رائحةٌ تُحكى دون كلمات</p>
    <p class="footer-copy">All rights reserved by Wahm</p>
  </div>
</footer>
<script src="main.js"></script>
<script src="transitions.js"></script>
</body>
</html>
